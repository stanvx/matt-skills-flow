<title>matt Task Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;700;800&family=Overpass+Mono:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a transit network map. Each open task is a line running through its stages as stations;
   gates are signals; closed tasks rest at the terminus below. Stations stack vertically on phones. */
:root {
  --paper: #eef1f0;
  --surface: #ffffff;
  --ink: #15202b;
  --muted: #5a6672;
  --rule: #d3d9d7;
  --dim-track: #c9d0cd;
  --signal-wait: #d98e04;
  --signal-go: #22884a;
  --signal-stop: #c23a2b;
  --line-idea: #2d5fcf;
  --line-ticket: #00827a;
  --line-broken: #d0432a;
  --line-foggy: #7a4fc4;
  --display: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --dot: 22px;
  --track: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f151b; --surface: #17202a; --ink: #e6ebee; --muted: #93a0ab; --rule: #2a3642; --dim-track: #33404c;
    --signal-wait: #f0a82a; --signal-go: #3dba6c; --signal-stop: #ef6252;
    --line-idea: #5b8bf0; --line-ticket: #1fb3a8; --line-broken: #f06a4f; --line-foggy: #a07ef0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f151b; --surface: #17202a; --ink: #e6ebee; --muted: #93a0ab; --rule: #2a3642; --dim-track: #33404c;
  --signal-wait: #f0a82a; --signal-go: #3dba6c; --signal-stop: #ef6252;
  --line-idea: #5b8bf0; --line-ticket: #1fb3a8; --line-broken: #f06a4f; --line-foggy: #a07ef0;
  color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: grid; gap: 28px; }
a { color: inherit; text-underline-offset: 3px; }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--line-idea); outline-offset: 3px; border-radius: 3px; }

/* Masthead */
.mast { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
.mast h1 { margin: 0; font: 800 clamp(30px, 5vw, 44px)/1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.mast h1 span { color: var(--muted); font-weight: 600; }
.status { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 600 13px/1.3 var(--display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.status b { color: var(--ink); font-variant-numeric: tabular-nums; }
.status .wait b { color: var(--signal-wait); }

/* Key: the four ways onto the network */
.key { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 8px; }
.roundel { --c: var(--line-idea); display: inline-grid; place-items: center; width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--c); color: var(--surface); font: 800 13px/1 var(--display); padding-top: 2px; }
.key .roundel { width: 20px; height: 20px; font-size: 11px; }
.idea { --c: var(--line-idea); } .ticket { --c: var(--line-ticket); } .broken { --c: var(--line-broken); } .foggy { --c: var(--line-foggy); }

/* A line */
.lines { display: grid; gap: 22px; }
.line { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 22px 24px 20px; display: grid; gap: 22px; }
.line-head { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 340px); gap: 14px 18px; align-items: start; }
.line-head h2 { margin: 0; font: 700 22px/1.2 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.meta { margin-top: 4px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.meta .slug { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.next { min-width: 0; }
.next .label { display: flex; align-items: center; gap: 8px; font: 700 11px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.next .label::before { content: ""; width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 3px solid var(--c); background: var(--surface); }
.next.is-waiting .label::before { border-color: var(--signal-wait); background: var(--signal-wait); }
.next code { display: block; margin-top: 6px; font: 600 15px/1.35 var(--mono); color: var(--c); overflow-wrap: anywhere; }
.next p { margin: 4px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.next.is-waiting code { color: var(--signal-wait); }

/* The track */
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.stop { position: relative; display: grid; justify-items: center; align-content: start; gap: 10px; text-align: center; padding-inline: 6px; min-width: 0; }
.half { position: absolute; top: calc(var(--dot) / 2 - var(--track) / 2); height: var(--track); background: var(--c); }
.half.l { left: 0; right: 50%; }
.half.r { left: 50%; right: 0; }
.half.dim { background: repeating-linear-gradient(90deg, var(--dim-track) 0 10px, transparent 10px 16px); }
.stop:first-child .half.l, .stop:last-child .half.r { display: none; }
.dot { position: relative; z-index: 1; width: var(--dot); height: var(--dot); border-radius: 50%; box-sizing: border-box; background: var(--surface); border: 5px solid var(--c); }
.stop.done .dot { background: var(--c); border-color: var(--c); box-shadow: inset 0 0 0 4px var(--surface); }
.stop.ahead .dot { border-color: var(--dim-track); border-width: 3px; }
.stop.now .dot { transform: scale(1.3); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 22%, transparent); animation: halo 2.4s ease-in-out infinite; }
@keyframes halo { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--c) 8%, transparent); } }
.name { font: 700 14px/1.25 var(--display); overflow-wrap: anywhere; }
.name::before { content: "/"; color: var(--muted); font-weight: 600; }
.stop.ahead .name { color: var(--muted); font-weight: 600; }
.stop.now .name { font-size: 15px; }
.signal { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.lamp { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--dim-track); box-sizing: border-box; }
.signal.waiting { color: var(--signal-wait); }
.signal.waiting .lamp { background: var(--signal-wait); border-color: var(--signal-wait); animation: blink 1.6s steps(2, jump-none) infinite; }
.signal.approved { color: var(--signal-go); }
.signal.approved .lamp { background: var(--signal-go); border-color: var(--signal-go); }
@keyframes blink { 50% { opacity: 0.35; } }
.made { display: grid; gap: 3px; justify-items: center; font: 400 12px/1.35 var(--mono); color: var(--muted); min-width: 0; max-width: 100%; }
.made a, .made span { overflow-wrap: anywhere; }

/* Below the track */
.below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px 28px; border-top: 1px solid var(--rule); padding-top: 16px; }
.below h3 { margin: 0 0 8px; font: 700 11px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.checks code { font: 600 12px/1.4 var(--mono); }
.chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 3px 9px 2px; border-radius: 999px; font: 700 11px/1.4 var(--display); letter-spacing: 0.08em; text-transform: uppercase; border: 1.5px solid currentColor; }
.chip.pass { color: var(--signal-go); } .chip.fail { color: var(--signal-stop); }
.none { font-size: 13px; color: var(--muted); margin: 0; }
details summary { cursor: pointer; font: 700 11px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); list-style-position: outside; }
.log { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; max-height: 260px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 52px 72px minmax(0, 1fr); gap: 8px; }
.log .t { font: 400 12px/1.5 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.log .k { font: 600 11px/1.7 var(--display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.log .w { overflow-wrap: anywhere; }
.log .bad { color: var(--signal-stop); } .log .good { color: var(--signal-go); }

/* Terminus */
.terminus h2 { margin: 0 0 10px; font: 700 13px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.terminus ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.terminus li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.terminus .roundel { width: 20px; height: 20px; font-size: 11px; opacity: 0.75; }
.terminus .when { font: 400 12px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.terminus .t { overflow-wrap: anywhere; }

/* Empty state: the canonical line, not yet running */
.empty { background: var(--surface); border: 1px dashed var(--dim-track); border-radius: 6px; padding: 24px; display: grid; gap: 20px; }
.empty .track .half { background: repeating-linear-gradient(90deg, var(--dim-track) 0 10px, transparent 10px 16px); }
.empty .dot { border-color: var(--dim-track); border-width: 3px; }
.empty .name { color: var(--muted); }
.empty p { margin: 0; max-width: 62ch; color: var(--muted); }
.empty code { font: 600 13px/1.4 var(--mono); color: var(--ink); background: var(--paper); padding: 1px 6px; border-radius: 3px; }

@media (max-width: 760px) {
  .line { padding: 18px 16px; }
  .line-head { grid-template-columns: auto minmax(0, 1fr); }
  .next { grid-column: 1 / -1; }
  .below { grid-template-columns: minmax(0, 1fr); }
  .track { grid-template-columns: minmax(0, 1fr); }
  .stop { grid-template-columns: var(--dot) minmax(0, 1fr); justify-items: start; text-align: left; column-gap: 14px; row-gap: 4px; padding: 0 0 18px; }
  .stop > :not(.half):not(.dot) { grid-column: 2; }
  .stop .dot { grid-row: 1 / span 3; }
  .half.l, .half.r { width: var(--track); left: calc(var(--dot) / 2 - var(--track) / 2); right: auto; }
  .half.l { top: 0; bottom: auto; height: calc(var(--dot) / 2); }
  .half.r { top: calc(var(--dot) / 2); bottom: 0; }
  .half.dim, .empty .track .half { background: repeating-linear-gradient(180deg, var(--dim-track) 0 8px, transparent 8px 13px); }
  .stop:last-child { padding-bottom: 0; }
  .made { justify-items: start; }
  .log li { grid-template-columns: 44px minmax(0, 1fr); }
  .log .k { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .stop.now .dot, .signal.waiting .lamp { animation: none; }
}
</style>

<main class="wrap">
  <header class="mast">
    <h1>Task Rail <span>matt</span></h1>
    <div class="status" id="status" aria-live="polite"><span>Waiting for the board</span></div>
  </header>

  <div class="key" aria-label="Where a task joins the flow">
    <span><i class="roundel idea">I</i>Idea, from /grill-with-docs</span>
    <span><i class="roundel ticket">T</i>Ticket, from /implement</span>
    <span><i class="roundel broken">B</i>Broken, from diagnosing-bugs</span>
    <span><i class="roundel foggy">F</i>Foggy, from /wayfinder</span>
  </div>

  <section class="lines" id="lines" aria-label="Open tasks"></section>
  <section class="terminus" id="terminus" aria-label="Closed tasks" hidden></section>
</main>

<script>
(() => {
  const LETTER = { idea: 'I', ticket: 'T', broken: 'B', foggy: 'F' };
  const FROM = { idea: 'from an idea', ticket: 'from a ticket', broken: 'from a bug', foggy: 'from a foggy effort' };
  const CANON = ['grill-with-docs', 'to-spec', 'to-tickets', 'implement-spec', 'retro'];
  const linesEl = document.getElementById('lines');
  const terminusEl = document.getElementById('terminus');
  const statusEl = document.getElementById('status');
  let tasks = [];
  let reason = 'loading';

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const entryOf = task => (LETTER[task.entry] ? task.entry : 'idea');
  const ago = at => {
    const minutes = Math.max(0, Math.round((Date.now() - at) / 60000));
    if (minutes < 1) return 'just now';
    if (minutes < 60) return minutes + 'm ago';
    const hours = Math.round(minutes / 60);
    return hours < 48 ? hours + 'h ago' : Math.round(hours / 24) + 'd ago';
  };
  const since = (task, at) => '+' + Math.max(0, Math.round((at - task.createdAt) / 60000)) + 'm';
  const isUrl = text => /^https:\/\/\S+$/.test(text);
  const shortPointer = text => {
    const pull = /\/pull\/(\d+)$/.exec(text);
    if (pull) return 'PR #' + pull[1];
    const issue = /\/issues\/(\d+)$/.exec(text);
    if (issue) return 'issue #' + issue[1];
    return text.split('/').slice(-2).join('/');
  };
  const pointerNode = text => {
    if (isUrl(text)) {
      const link = el('a', '', shortPointer(text));
      link.href = text;
      link.target = '_blank';
      link.rel = 'noopener';
      return link;
    }
    const span = el('span', '', shortPointer(text));
    span.title = text;
    return span;
  };

  const station = stop => {
    const li = el('li', 'stop ' + stop.state);
    const reached = stop.state !== 'ahead';
    li.append(el('i', 'half l' + (reached ? '' : ' dim')));
    li.append(el('i', 'half r' + (stop.state === 'done' ? '' : ' dim')));
    li.append(el('i', 'dot'));
    const name = el('span', 'name', stop.stage);
    if (stop.state === 'now') name.setAttribute('aria-current', 'step');
    li.append(name);
    if (stop.gate) {
      const signal = el('span', 'signal ' + stop.gate);
      signal.append(el('i', 'lamp'), document.createTextNode(
        stop.gate === 'approved' ? 'Approved' : stop.gate === 'waiting' ? 'Awaiting approval' : 'Gate'));
      li.append(signal);
    }
    if (stop.artifacts && stop.artifacts.length) {
      const made = el('span', 'made');
      stop.artifacts.slice(-4).forEach(pointer => made.append(pointerNode(pointer)));
      li.append(made);
    }
    li.setAttribute('aria-label', stop.stage + ', ' + (stop.state === 'now' ? 'current stage' : stop.state === 'done' ? 'passed' : 'ahead'));
    return li;
  };

  const line = task => {
    const entry = entryOf(task);
    const article = el('article', 'line ' + entry);
    const head = el('div', 'line-head');
    const roundel = el('i', 'roundel ' + entry, LETTER[entry]);
    roundel.setAttribute('aria-hidden', 'true');
    const titles = el('div');
    titles.append(el('h2', '', task.title));
    const meta = el('div', 'meta');
    meta.append(el('span', '', task.repo), el('span', '', FROM[entry]), el('span', '', 'started ' + ago(task.createdAt)),
      el('span', '', 'updated ' + ago(task.updatedAt)), el('span', 'slug', task.slug));
    titles.append(meta);
    const waiting = (task.rail || []).some(stop => stop.gate === 'waiting');
    const next = el('div', 'next' + (waiting ? ' is-waiting' : ''));
    next.append(el('div', 'label', 'Next'));
    next.append(el('code', '', '/' + task.next.command + (task.next.args ? ' ' + task.next.args : '')));
    next.append(el('p', '', task.next.why));
    head.append(roundel, titles, next);

    const stops = task.rail && task.rail.length ? task.rail : [];
    const track = el('ol', 'track');
    track.style.setProperty('--n', String(Math.max(1, stops.length)));
    track.setAttribute('aria-label', 'Stages');
    stops.forEach(stop => track.append(station(stop)));

    const below = el('div', 'below');
    const proof = el('div');
    proof.append(el('h3', '', 'Checks'));
    if (task.evidence && task.evidence.length) {
      const list = el('ul', 'checks');
      task.evidence.forEach(line => {
        const item = el('li');
        const match = /^`([^`]+)`: (.*)$/.exec(line);
        if (match) item.append(el('code', '', match[1]), document.createTextNode(' ' + match[2]));
        else item.textContent = line;
        list.append(item);
      });
      proof.append(list);
    } else {
      proof.append(el('p', 'none', 'No test, typecheck or lint runs yet.'));
    }
    if (task.ci) {
      const chip = el('a', 'chip ' + (task.ci.ok ? 'pass' : 'fail'), task.ci.ok ? 'CI passed' : 'CI failed');
      if (isUrl(task.ci.url)) { chip.href = task.ci.url; chip.target = '_blank'; chip.rel = 'noopener'; }
      proof.append(chip);
    }
    const journey = el('details');
    journey.append(el('summary', '', 'Journey log (' + (task.journey || []).length + ')'));
    const log = el('ol', 'log');
    (task.journey || []).slice().reverse().forEach(event => {
      const item = el('li');
      const what = el('span', 'w' + (event.ok === false ? ' bad' : event.ok === true ? ' good' : ''),
        event.what + (event.ok === undefined ? '' : event.ok ? ', passed' : ', failed'));
      item.append(el('span', 't', since(task, event.at)), el('span', 'k', event.kind), what);
      log.append(item);
    });
    journey.append(log);
    below.append(proof, journey);

    article.append(head, track, below);
    return article;
  };

  const emptyState = () => {
    const box = el('div', 'empty');
    const track = el('ol', 'track');
    track.style.setProperty('--n', String(CANON.length));
    CANON.forEach(stage => track.append(station({ stage, state: "ahead" })));
    const text = el('p');
    if (reason === 'unavailable') {
      text.textContent = 'This board fills from Claude Code. Open it on claude.ai, signed in, to see the tasks it holds.';
    } else {
      text.append(document.createTextNode('No lines running. In Claude Code with the matt mod, run '));
      text.append(el('code', '', '/matt share <this board\'s link>'));
      text.append(document.createTextNode(', then '));
      text.append(el('code', '', '/matt new <what are we doing>'));
      text.append(document.createTextNode('. Each task appears here as a line and moves as the work does.'));
    }
    box.append(track, text);
    return box;
  };

  const render = () => {
    const open = tasks.filter(task => task.isOpen)
      .sort((a, b) => {
        const wait = task => ((task.rail || []).some(stop => stop.gate === 'waiting') ? 0 : 1);
        return wait(a) - wait(b) || b.updatedAt - a.updatedAt;
      });
    const closed = tasks.filter(task => !task.isOpen).sort((a, b) => (b.closedAt || 0) - (a.closedAt || 0)).slice(0, 12);
    const waiting = open.filter(task => (task.rail || []).some(stop => stop.gate === 'waiting')).length;

    statusEl.replaceChildren();
    if (reason === 'live') {
      const part = (count, label, cls) => {
        const span = el('span', cls || '');
        span.append(el('b', '', String(count)), document.createTextNode(' ' + label));
        return span;
      };
      statusEl.append(part(open.length, open.length === 1 ? 'line running' : 'lines running'),
        part(waiting, 'awaiting approval', waiting ? 'wait' : ''), part(closed.length, 'at terminus'));
    } else {
      statusEl.append(el('span', '', reason === 'loading' ? 'Connecting' : 'Offline preview'));
    }

    linesEl.replaceChildren(...(open.length ? open.map(line) : [emptyState()]));
    terminusEl.hidden = closed.length === 0;
    terminusEl.replaceChildren();
    if (closed.length) {
      terminusEl.append(el('h2', '', 'Terminus'));
      const list = el('ul');
      closed.forEach(task => {
        const item = el('li');
        const entry = entryOf(task);
        const roundel = el('i', 'roundel ' + entry, LETTER[entry]);
        roundel.setAttribute('aria-hidden', 'true');
        item.append(roundel, el('span', 't', task.title + ' (' + task.repo + ')'), el('span', 'when', 'closed ' + ago(task.closedAt || task.updatedAt)));
        list.append(item);
      });
      terminusEl.append(list);
    }
  };

  const isTask = data => data && typeof data.title === 'string' && typeof data.slug === 'string' && data.next && Array.isArray(data.rail);

  render();
  setInterval(render, 60000);

  const start = async () => {
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) {
      reason = 'unavailable';
      render();
      return;
    }
    db.collection('tasks').onSnapshot(snap => {
      tasks = snap.docs.map(doc => doc.data()).filter(isTask);
      reason = 'live';
      render();
    }, () => {
      reason = 'unavailable';
      render();
    });
  };
  start();
})();
</script>
